[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aidus"
version = "0.2.2"
description = "Zero-dependency writer and validator for AIDUS, the AI Development Usage Specification."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
authors = [{ name = "Rae" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/JazonraeB/aidus"
Specification = "https://github.com/JazonraeB/aidus/blob/main/spec/AIDUS.md"

[project.scripts]
aidus = "aidus.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
