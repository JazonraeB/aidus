name: conformance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.10" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - name: Fixtures are reproducible
        shell: bash
        run: |
          python fixtures/events/generate.py
          python fixtures/claude_code/generate.py
          git diff --exit-code -- fixtures
      - run: python -m pytest -q
      - name: CLI installs with no dependencies and runs
        shell: bash
        run: |
          python -m venv /tmp/clean
          if [ -x /tmp/clean/bin/python ]; then PY=/tmp/clean/bin/python; else PY=/tmp/clean/Scripts/python; fi
          $PY -m pip install ./cli
          $PY -c "import importlib.metadata as m; extra = sorted({d.metadata['Name'] for d in m.distributions()} - {'aidus', 'pip', 'setuptools', 'wheel'}); assert not extra, extra"
          $PY -m aidus --version
